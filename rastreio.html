<body class="conta is-in">
  <canvas id="gl" aria-hidden="true"></canvas>
  <header class="nav ct-nav">
    <a class="nav-menu" href="index.html"><span class="lines"><i></i><i></i></span><span class="lbl">Voltar à loja</span></a>
    <a class="nav-brand" href="index.html" aria-label="Vellure, início"><span>VELLURE</span></a>
    <div class="nav-tools"><button class="nav-theme" type="button" data-theme-toggle aria-label="Mudar para o modo claro"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><a class="btn-text" href="conta.html">Minha conta</a></div>
  </header>

  <main class="ct tr" aria-live="polite">
    <section class="tr-hero">
      <h1>Onde está o seu pedido?</h1>
      <p class="ct-p">Digite o número do pedido e o CEP da entrega. Não precisa entrar na conta.</p>
      <form class="tr-form" id="trForm" novalidate>
        <label class="co-f"><span>Número do pedido</span><input name="code" placeholder="VL2610-3F9A2" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
        <label class="co-f"><span>CEP da entrega <small>ou os 4 últimos números do WhatsApp</small></span><input name="key" inputmode="numeric" placeholder="00000-000" autocomplete="postal-code" required></label>
        <button class="btn-gold" type="submit">Rastrear</button>
        <p class="tr-msg" id="trMsg" role="alert"></p>
      </form>
    </section>
    <section class="tr-res" id="trRes" hidden></section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="assets/vendor/gsap.min.js"></script>
